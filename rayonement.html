<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rayonnement</title>
    <link rel="stylesheet" href="topo.css">
</head>
<body>
    <nav class="topnav">
        <a href="topo.html">Distance & Gisement</a>
        <a href="rayonement.html" class="active">Rayonnement</a>
        <a href="intersection.html">Intersection</a>
    </nav>

    <main class="card">
        <h1>Calcul d'un point rayonné</h1>
        <p class="subtitle">Station S(x₁, y₁), référence R(x₂, y₂), angle α et distance d → point M</p>

        <fieldset>
            <legend>Station S</legend>
            <div class="form-grid">
                <label>x₁ <span class="unit">(m)</span>
                    <input type="number" id="PX1" step="any" placeholder="ex. 1000.00">
                </label>
                <label>y₁ <span class="unit">(m)</span>
                    <input type="number" id="PY1" step="any" placeholder="ex. 2000.00">
                </label>
            </div>
        </fieldset>

        <fieldset>
            <legend>Référence R</legend>
            <div class="form-grid">
                <label>x₂ <span class="unit">(m)</span>
                    <input type="number" id="PX2" step="any" placeholder="ex. 1100.00">
                </label>
                <label>y₂ <span class="unit">(m)</span>
                    <input type="number" id="PY2" step="any" placeholder="ex. 2050.00">
                </label>
            </div>
        </fieldset>

        <fieldset>
            <legend>Observation vers M</legend>
            <div class="form-grid">
                <label>Angle α <span class="unit">(gon, sens horaire)</span>
                    <input type="number" id="alpha" step="any" placeholder="ex. 50.0000">
                </label>
                <label>Distance <span class="unit">(m)</span>
                    <input type="number" id="D" step="any" placeholder="ex. 75.500">
                </label>
            </div>
        </fieldset>

        <p class="error" id="err"></p>
        <button onclick="calculer()">Calculer les coordonnées de M</button>

        <fieldset class="results">
            <legend>Coordonnées de M</legend>
            <div class="form-grid">
                <label>x <span class="unit">(m)</span>
                    <input id="x" readonly>
                </label>
                <label>y <span class="unit">(m)</span>
                    <input id="y" readonly>
                </label>
            </div>
        </fieldset>
    </main>

    <script>
        function gisementGon(dx, dy) {
            if (dx === 0 && dy === 0) return null;
            if (dx >= 0 && dy > 0)  return Math.atan(dx / dy) * 200 / Math.PI;
            if (dx >= 0 && dy < 0)  return Math.atan(Math.abs(dy / dx)) * 200 / Math.PI + 100;
            if (dx <  0 && dy < 0)  return Math.atan(dx / dy) * 200 / Math.PI + 200;
            if (dx <  0 && dy >= 0) return Math.atan(Math.abs(dy / dx)) * 200 / Math.PI + 300;
            return dx > 0 ? 100 : 300; // dy === 0
        }

        function calculer() {
            const err = document.getElementById("err");
            err.textContent = "";

            const x1 = Number(document.getElementById("PX1").value);
            const y1 = Number(document.getElementById("PY1").value);
            const x2 = Number(document.getElementById("PX2").value);
            const y2 = Number(document.getElementById("PY2").value);
            const alpha = Number(document.getElementById("alpha").value);
            const distance = Number(document.getElementById("D").value);

            if ([x1, y1, x2, y2, alpha, distance].some(v => Number.isNaN(v))) {
                err.textContent = "Veuillez remplir tous les champs.";
                return;
            }

            const Gsr = gisementGon(x2 - x1, y2 - y1);
            if (Gsr === null) {
                err.textContent = "Station et référence identiques : gisement indéfini.";
                return;
            }

            // Gisement S→M = gisement S→R + α  (α mesuré sens horaire)
            const Gsm = Gsr + alpha;
            const rad = Gsm * Math.PI / 200;

            const xM = x1 + distance * Math.sin(rad);
            const yM = y1 + distance * Math.cos(rad);

            document.getElementById("x").value = xM.toFixed(3);
            document.getElementById("y").value = yM.toFixed(3);
        }
    </script>
</body>
</html>
