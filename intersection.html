<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intersection</title>
    <link rel="stylesheet" href="topo.css">
</head>
<body>
    <nav class="topnav">
        <a href="topo.html">Distance & Gisement</a>
        <a href="rayonement.html">Rayonnement</a>
        <a href="intersection.html" class="active">Intersection</a>
    </nav>

    <main class="card">
        <h1>Calcul par intersection</h1>
        <p class="subtitle">Stations A(x₁, y₁) et B(x₂, y₂), angles α (en A) et β (en B) → point M</p>

        <fieldset>
            <legend>Point A</legend>
            <div class="form-grid">
                <label>x₁ <span class="unit">(m)</span>
                    <input type="number" id="x1" step="any" placeholder="ex. 1000.00">
                </label>
                <label>y₁ <span class="unit">(m)</span>
                    <input type="number" id="y1" step="any" placeholder="ex. 2000.00">
                </label>
            </div>
        </fieldset>

        <fieldset>
            <legend>Point B</legend>
            <div class="form-grid">
                <label>x₂ <span class="unit">(m)</span>
                    <input type="number" id="x2" step="any" placeholder="ex. 1200.00">
                </label>
                <label>y₂ <span class="unit">(m)</span>
                    <input type="number" id="y2" step="any" placeholder="ex. 2100.00">
                </label>
            </div>
        </fieldset>

        <fieldset>
            <legend>Angles observés</legend>
            <div class="form-grid">
                <label>α (BAM, en A) <span class="unit">(gon)</span>
                    <input type="number" id="alpha" step="any" placeholder="ex. 50.0000">
                </label>
                <label>β (ABM, en B) <span class="unit">(gon)</span>
                    <input type="number" id="beta" step="any" placeholder="ex. 60.0000">
                </label>
                <label>Côté de M par rapport à A→B
                    <select id="side">
                        <option value="right">À droite (sens horaire) — α ajouté</option>
                        <option value="left">À gauche (sens trigo) — α retranché</option>
                    </select>
                </label>
            </div>
        </fieldset>

        <p class="error" id="err"></p>
        <button onclick="calcul()">Calculer M</button>

        <fieldset class="results">
            <legend>Coordonnées de M</legend>
            <div class="form-grid">
                <label>x <span class="unit">(m)</span>
                    <input id="x" readonly>
                </label>
                <label>y <span class="unit">(m)</span>
                    <input id="y" readonly>
                </label>
                <label>AM <span class="unit">(m)</span>
                    <input id="AM" readonly>
                </label>
                <label>BM <span class="unit">(m)</span>
                    <input id="BM" readonly>
                </label>
            </div>
        </fieldset>
    </main>

    <style>
        select {
            font: inherit;
            font-size: 1rem;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #fff;
            color: var(--text);
            width: 100%;
        }
        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(75, 201, 112, 0.2);
        }
    </style>

    <script>
        function gisementGon(dx, dy) {
            if (dx === 0 && dy === 0) return null;
            if (dx >= 0 && dy > 0)  return Math.atan(dx / dy) * 200 / Math.PI;
            if (dx >= 0 && dy < 0)  return Math.atan(Math.abs(dy / dx)) * 200 / Math.PI + 100;
            if (dx <  0 && dy < 0)  return Math.atan(dx / dy) * 200 / Math.PI + 200;
            if (dx <  0 && dy >= 0) return Math.atan(Math.abs(dy / dx)) * 200 / Math.PI + 300;
            return dx > 0 ? 100 : 300; // dy === 0
        }

        function calcul() {
            const err = document.getElementById("err");
            err.textContent = "";

            const x1 = Number(document.getElementById("x1").value);
            const y1 = Number(document.getElementById("y1").value);
            const x2 = Number(document.getElementById("x2").value);
            const y2 = Number(document.getElementById("y2").value);
            const alpha = Number(document.getElementById("alpha").value);
            const beta = Number(document.getElementById("beta").value);
            const side = document.getElementById("side").value;

            if ([x1, y1, x2, y2, alpha, beta].some(v => Number.isNaN(v))) {
                err.textContent = "Veuillez remplir tous les champs.";
                return;
            }

            const gamma = 200 - alpha - beta;
            if (gamma <= 0 || alpha <= 0 || beta <= 0) {
                err.textContent = "α + β doit être < 200 gon, et α, β > 0.";
                return;
            }

            const AB = Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
            if (AB === 0) {
                err.textContent = "Les points A et B sont identiques.";
                return;
            }

            const sinG = Math.sin(gamma * Math.PI / 200);
            const AM = AB * Math.sin(beta * Math.PI / 200) / sinG;
            const BM = AB * Math.sin(alpha * Math.PI / 200) / sinG;

            const Gab = gisementGon(x2 - x1, y2 - y1);
            // M à droite de AB (convention horaire) : G_AM = G_AB + α
            // M à gauche : G_AM = G_AB − α
            const Gam = side === "right" ? Gab + alpha : Gab - alpha;
            const rad = Gam * Math.PI / 200;

            const xM = x1 + AM * Math.sin(rad);
            const yM = y1 + AM * Math.cos(rad);

            document.getElementById("x").value = xM.toFixed(3);
            document.getElementById("y").value = yM.toFixed(3);
            document.getElementById("AM").value = AM.toFixed(3);
            document.getElementById("BM").value = BM.toFixed(3);
        }
    </script>
</body>
</html>
